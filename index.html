<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <title>Learn vue js</title>
        <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    </head>
    <body>
        <div id="app">
            <input type="text" name="msg" v-model="msg">

            <h1>{{ msg }}</h1>
            {{ greating }}
        </div>

        <script>

            Vue.createApp({
                data() {
                  
                    return {
                        greating: 'What is up',
                        msg: 'a msg'
                    }
                }
            }).mount('#app')
        </script>
    </body>
</html>
